<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>带球动画调试</title>
<style>
  body { margin:0; background:#1a1a2e; color:#fff; font-family:sans-serif; }
  #stage { display:block; margin:10px auto; background:#2d6a4f; image-rendering:pixelated; }
  .ctl { text-align:center; margin:8px; }
  button { padding:8px 16px; margin:4px; font-size:16px; }
  #info { text-align:center; font-size:14px; color:#aaa; }
  .dirpad { display:grid; grid-template-columns:repeat(3,60px); gap:4px; justify-content:center; margin:10px; }
</style>
</head>
<body>
<canvas id="stage" width="480" height="360"></canvas>
<div id="info">frame: - | face: - | v: -</div>
<div class="ctl">
  <button id="bPlay">播放/暂停</button>
  <button id="bStep">单帧</button>
  <button id="bBall">带球/无球</button>
  <span>速度: <input type="range" id="speed" min="1" max="12" value="7"></span>
</div>
<div class="dirpad">
  <button data-dx="-1" data-dy="-1">↖</button>
  <button data-dx="0" data-dy="-1">↑</button>
  <button data-dx="1" data-dy="-1">↗</button>
  <button data-dx="-1" data-dy="0">←</button>
  <button data-dx="0" data-dy="0">■</button>
  <button data-dx="1" data-dy="0">→</button>
  <button data-dx="-1" data-dy="1">↙</button>
  <button data-dx="0" data-dy="1">↓</button>
  <button data-dx="1" data-dy="1">↘</button>
</div>
<script>
var SPR_V = 'spr2';
var kits = ['home'];
var atlas8 = {};
var b = new Image(); b.src = 'assets/sprites/home/run-8dir-with-ball.png?v=' + SPR_V;
var n = new Image(); n.src = 'assets/sprites/home/run-8dir-without-ball.png?v=' + SPR_V;
atlas8['home'] = { ball: b, nobal: n };
var cv = document.getElementById('stage'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;

var S = {
  x: 240, y: 180, dx: 1, dy: 0,           // 位置与方向
  playing: true, hasBall: true, speed: 7,  // 播放/带球/速度(m/s)
  ph: 0, lt: 0, face: 1,                   // 相位/时间戳/朝向
  stepOnce: false,
};

function dirRowFor(dx, dy) {
  if (!dx && !dy) return 2;
  var ang = Math.atan2(dy, dx);
  var t = (ang + Math.PI / 2) / (Math.PI * 2);
  if (t < 0) t += 1;
  return Math.round(t * 8) % 8;
}

function frameFor(t) {
  var dt = (t - S.lt) / 1000; S.lt = t;
  if (!(dt > 0)) dt = 0.016;
  var v = (S.dx || S.dy) ? S.speed : 0;
  var moving = v > 1.2;
  var fps = 6 + Math.min(10, v / 2);
  if (S.playing || S.stepOnce) { S.ph = (S.ph + fps * dt) % 4; S.stepOnce = false; }
  var dRow = dirRowFor(S.dx, S.dy);
  var col = moving ? Math.floor(S.ph) % 4 : 0;
  return { dirRow: dRow, col: col, moving: moving, v: v };
}

function draw(t) {
  requestAnimationFrame(draw);
  var f = frameFor(t || 16);
  // 移动
  if (S.playing && (S.dx || S.dy)) {
    var n = Math.sqrt(S.dx*S.dx + S.dy*S.dy) || 1;
    S.x += S.dx/n * S.speed / 60 * 3;
    S.y += S.dy/n * S.speed / 60 * 3;
    if (S.x < 40) S.x = 440; if (S.x > 440) S.x = 40;
    if (S.y < 60) S.y = 300; if (S.y > 300) S.y = 60;
  }
  g.clearRect(0,0,480,360);
  g.fillStyle = '#2d6a4f'; g.fillRect(0,0,480,360);
  // 网格
  g.strokeStyle = 'rgba(255,255,255,0.1)';
  for (var i=0;i<480;i+=48){ g.beginPath();g.moveTo(i,0);g.lineTo(i,360);g.stroke(); }

  var img = S.hasBall ? atlas8['home'].ball : atlas8['home'].nobal;
  if (img.complete && img.naturalWidth) {
    var sw = 48, sh = 72;
    var sx = f.col * sw, sy = f.dirRow * sh;
    var dw = 48*2, dh = 72*2;
    g.save();
    g.translate(S.x, S.y);
    // 8 方向无翻转，直接画对应行
    g.drawImage(img, sx, sy, sw, sh, -dw/2, -dh, dw, dh);
    g.restore();
    // 有球版脚下自带球，无球版不画球（球已踢出，单独画轨迹）
  }
  var dirNames = ['上','右上','右','右下','下','左下','左','左上'];
  document.getElementById('info').textContent =
    '方向=' + dirNames[f.dirRow] + ' | 帧=' + f.col +
    ' | v=' + f.v.toFixed(1) + 'm/s | 移动=(' + S.dx + ',' + S.dy + ')' +
    (S.hasBall ? ' | 有球版' : ' | 无球版');
}

document.getElementById('bPlay').onclick = function(){ S.playing = !S.playing; };
document.getElementById('bStep').onclick = function(){ S.playing = false; S.stepOnce = true; };
document.getElementById('bBall').onclick = function(){ S.hasBall = !S.hasBall; };
document.getElementById('speed').oninput = function(e){ S.speed = +e.target.value; };
document.querySelectorAll('.dirpad button').forEach(function(b){
  b.onclick = function(){ S.dx = +b.dataset.dx; S.dy = +b.dataset.dy; };
});
requestAnimationFrame(draw);
</script>
</body>
</html>
