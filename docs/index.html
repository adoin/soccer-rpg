<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>热血足球 RPG - Demo</title>
<link rel="stylesheet" href="css/style.css?v=mw1vdgej">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<!-- touch-float-v1：摇杆和虚拟键在画布之上，左 40% 点哪哪就是摇杆 -->
<div id="touch-ui" hidden>
  <div id="stick-zone"></div>
  <div id="stick-hint" aria-hidden="true"></div>
  <div id="float-stick" hidden>
    <div id="float-stick-base"></div>
    <div id="float-stick-knob"></div>
  </div>
  <div id="vkey-layer"></div>
  <div id="touch-debug" hidden></div>
</div>
<div id="rotate-prompt">
  <div class="rotate-phone"></div>
  <div class="rotate-title">请横屏</div>
  <div class="rotate-sub">把手机横过来。横屏后比赛会铺满屏幕。</div>
</div>
<!-- 共享常量/阵容（UMD，同时供 Node 使用） -->
<script src="shared/constants.js?v=mw1vdgej"></script>
<script src="shared/teams.js?v=mw1vdgej"></script>
<script src="shared/kits.js?v=mw1vdgej"></script>
<!-- 纯前端试玩版：引擎跑在浏览器里（正式版走服务器，见 README） -->
<script src="engine.bundle.js?v=mw1vdgej"></script>
<script src="js/api-local.js?v=mw1vdgej"></script>
<!-- 客户端 -->
<script src="js/sprites.js?v=mw1vdgej"></script>
<script src="js/manga-cutin.js?v=mw1vdgej"></script>
<script src="js/main.js?v=mw1vdgej"></script>
</body>
</html>
