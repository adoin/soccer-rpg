<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>漫画分镜三幕验证</title>
<style>body{background:#222;margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;color:#fff;font-family:sans-serif}
canvas{border:1px solid #555} .lbl{font-size:14px;color:#ffd94a}</style>
</head><body>
<div class="lbl">第一幕：假动作 (t=0.6s)</div><canvas id="c1" width="800" height="500"></canvas>
<div class="lbl">第二幕：呆住 (t=1.6s)</div><canvas id="c2" width="800" height="500"></canvas>
<div class="lbl">第三幕：突破 (t=2.6s)</div><canvas id="c3" width="800" height="500"></canvas>
<script src="shared/kits.js"></script>
<script>
// ---- 最小 mock ----
var W = 800, H = 500;
var ctx = null;
var isTouch = false;
var state = { clockLabel: '上半场 12:34', score: { home: 1, away: 0 } };
function cutActionId(a) { return 'test-' + a.cut; }
function text(s, x, y, size, color, align, bold) {
  ctx.save();
  ctx.font = (bold ? 'bold ' : '') + size + 'px sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
  ctx.restore();
}
</script>
<script src="js/manga-cutin.js"></script>
<script>
// ---- 渲染三幕 ----
var fakeAction = { cut: 'dribble-win', label: '突破', playerName: '测试球员', team: 'home' };
function renderFrame(canvasId, elSec) {
  var cv = document.getElementById(canvasId);
  ctx = cv.getContext('2d');
  W = cv.width; H = cv.height;
  // 固定时间线：lastId 预设让 el = elSec
  MANGA.lastId = 'test-dribble-win';
  MANGA.startT = 0;
  drawMangaDribbleWin(fakeAction, elSec * 1000);
}
var tries = 0;
var timer = setInterval(function () {
  tries++;
  if (MANGA.ready || tries > 100) {
    clearInterval(timer);
    if (!MANGA.ready) { document.body.innerHTML += '<div style="color:red">MANGA 资源未就绪</div>'; return; }
    renderFrame('c1', 0.6);
    renderFrame('c2', 1.6);
    renderFrame('c3', 2.6);
    document.title = 'DONE-三幕渲染完成';
  }
}, 100);
mangaInit();
</script>
</body></html>
